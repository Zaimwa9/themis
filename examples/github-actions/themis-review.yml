# Themis review via GitHub Actions — copy to .github/workflows/ in the
# repository you want reviewed. See docs/github-action.md for details.
name: Themis review

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read        # clone the PR, read .themis/config.yaml
  pull-requests: write  # inline findings, summary, thread replies
  issues: write         # reactions and courtesy comments
  checks: read          # CI snapshot in the review context
  statuses: read

# One run per PR at a time. cancel-in-progress stays false: a mention
# command must queue behind a running review, not kill it mid-post. Without
# queue: max GitHub keeps a single pending run per group and silently
# replaces it when a third event arrives; max retains every request, FIFO.
concurrency:
  group: themis-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false
  queue: max

jobs:
  themis:
    # The action itself skips drafts, bot comments, and non-PR comments;
    # this filter just avoids spinning a runner for them.
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.sender.type != 'Bot') ||
      (github.event_name == 'pull_request_review_comment' && github.event.sender.type != 'Bot')
    runs-on: ubuntu-latest
    # Default .themis limits allow 2 engine attempts x 20 min, plus
    # setup, clone, and posting; the cap must outlast that budget or the
    # job dies without the pipeline's failure comment.
    timeout-minutes: 60
    steps:
      # Pinned to a release commit SHA on purpose: tags and branches are
      # mutable, and this workflow hands the action your secrets. Bump the
      # SHA and the version comment together when upgrading.
      - uses: Zaimwa9/themis@54febf2cfb0c0efedcecfca2d5466a8eeca60a6b # v0.11.0
        with:
          engine: claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
